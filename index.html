<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Human Tracker - Auto Flashlight Lens Detection</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #121212; color: #ffffff;
      font-family: sans-serif; overflow: hidden;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; height: 100vh;
    }
    
    #controls {
      position: absolute; top: 15px; z-index: 10;
      display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center;
    }
    .badge {
      background: rgba(0, 0, 0, 0.7); padding: 8px 16px;
      border-radius: 20px; font-size: 14px; border: 1px solid #333;
    }
    .btn {
      background: #ff3366; color: white; border: none;
      padding: 8px 16px; border-radius: 20px; font-size: 14px;
      font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 6px;
    }
    .btn:disabled { background: #555555; cursor: not-allowed; }
    .btn.recording { background: #ff0000; animation: pulse 1.5s infinite; }
    
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

    .container {
      position: relative; width: 100vw; height: 100vh;
      display: flex; justify-content: center; align-items: center;
    }
    video#webcam { display: none; }
    canvas#output { width: 100%; height: 100%; object-fit: cover; }

    /* Playback Modal */
    #playbackModal {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.9); z-index: 20; flex-direction: column;
      align-items: center; justify-content: center; gap: 15px; padding: 20px;
    }
    #recordedVideo { max-width: 90%; max-height: 70vh; border-radius: 10px; border: 2px solid #00ffcc; }
    .modal-actions { display: flex; gap: 15px; }
    .btn-secondary { background: #00ffcc; color: #000; text-decoration: none; padding: 8px 16px; border-radius: 20px; font-weight:bold; cursor: pointer;}
    .btn-close { background: #444; color: #fff; padding: 8px 16px; border-radius: 20px; border: none; font-weight:bold; cursor: pointer;}
  </style>

  <!-- TensorFlow.js and COCO-SSD -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
</head>
<body>

  <div id="controls">
    <div id="status" class="badge">Scanning Lenses...</div>
    <div id="torchStatus" class="badge">🔦 Searching Torch Lens...</div>
    <button id="recordBtn" class="btn" disabled>🔴 Record</button>
  </div>

  <div class="container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="output"></canvas>
  </div>

  <div id="playbackModal">
    <h2>Playback Recording</h2>
    <video id="recordedVideo" controls></video>
    <div class="modal-actions">
      <a id="downloadBtn" class="btn-secondary" download="human-tracking.webm">Download Video</a>
      <button id="closeModalBtn" class="btn-close">Close</button>
    </div>
  </div>

  <script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('output');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('status');
    const torchStatusText = document.getElementById('torchStatus');
    const recordBtn = document.getElementById('recordBtn');
    
    // Playback variables
    const playbackModal = document.getElementById('playbackModal');
    const recordedVideo = document.getElementById('recordedVideo');
    const downloadBtn = document.getElementById('downloadBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');

    let model;
    let videoTrack;
    let isTorchOn = false;
    let lastBrightnessCheck = 0;
    
    // Recording variables
    let mediaRecorder;
    let recordedChunks = [];
    let isRecording = false;

    // 1. Lens Scanner: Finds the camera lens that physically supports the flashlight
    async function setupCamera() {
      try {
        // Request initial permission to unlock device list & capabilities
        let initialStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });

        // Enumerate all video input devices (lenses)
        const devices = await navigator.mediaDevices.enumerateDevices();
        const videoDevices = devices.filter(d => d.kind === 'videoinput');

        let torchStream = null;
        let torchTrack = null;

        // Iterate through all camera lenses to find the one with torch capabilities
        for (const device of videoDevices) {
          try {
            const testStream = await navigator.mediaDevices.getUserMedia({
              video: { deviceId: { exact: device.deviceId }, width: { ideal: 1280 }, height: { ideal: 720 } },
              audio: false
            });
            const track = testStream.getVideoTracks()[0];
            const capabilities = track.getCapabilities ? track.getCapabilities() : {};

            if (capabilities.torch) {
              // Found the specific lens tied to the physical flashlight!
              torchStream = testStream;
              torchTrack = track;
              
              // Clean up initial stream if it wasn't the torch lens
              if (initialStream && initialStream !== testStream) {
                initialStream.getTracks().forEach(t => t.stop());
              }
              break;
            } else {
              // Not the torch lens; close test stream unless it's initial
              if (testStream !== initialStream) {
                testStream.getTracks().forEach(t => t.stop());
              }
            }
          } catch (e) {
            console.warn('Could not inspect lens:', device.label, e);
          }
        }

        // Fallback to initial stream if no lens explicitly reports torch capability
        if (!torchStream) {
          torchStream = initialStream;
          torchTrack = initialStream.getVideoTracks()[0];
          torchStatusText.innerText = '🔦 Torch: Not Available';
        } else {
          torchStatusText.innerText = '🔦 Torch Lens Locked';
          torchStatusText.style.borderColor = '#00ffcc';
        }

        video.srcObject = torchStream;
        videoTrack = torchTrack;

        return new Promise((resolve) => {
          video.onloadedmetadata = () => resolve(video);
        });
      } catch (err) {
        statusText.innerText = 'Camera access denied.';
        console.error(err);
      }
    }

    // 2. Auto-Flashlight Logic
    async function handleAutoTorch() {
      const now = Date.now();
      if (now - lastBrightnessCheck < 500) return; // Check every 0.5s
      lastBrightnessCheck = now;

      if (!videoTrack) return;
      const capabilities = videoTrack.getCapabilities && videoTrack.getCapabilities();
      if (!capabilities || !capabilities.torch) return;

      // Calculate average scene brightness
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
      let totalLuminance = 0;
      let samples = 0;
      
      for (let i = 0; i < imageData.length; i += 400) {
        const r = imageData[i];
        const g = imageData[i+1];
        const b = imageData[i+2];
        const luminance = 0.299 * r + 0.587 * g + 0.114 * b; 
        totalLuminance += luminance;
        samples++;
      }
      
      const avgBrightness = totalLuminance / samples;
      
      try {
        if (avgBrightness < 40 && !isTorchOn) {
          await videoTrack.applyConstraints({ advanced: [{ torch: true }] });
          isTorchOn = true;
          torchStatusText.innerText = '🔦 Auto-Torch: ON';
          torchStatusText.style.borderColor = '#ffcc00';
        } else if (avgBrightness > 80 && isTorchOn) {
          await videoTrack.applyConstraints({ advanced: [{ torch: false }] });
          isTorchOn = false;
          torchStatusText.innerText = '🔦 Auto-Torch: OFF';
          torchStatusText.style.borderColor = '#333';
        }
      } catch (err) {
        console.error('Failed to toggle flashlight', err);
      }
    }

    // 3. Continuous Frame Processing & Detection
    async function detectFrame() {
      if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
      }

      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      handleAutoTorch();

      if (model) {
        const predictions = await model.detect(video);

        predictions.forEach(prediction => {
          if (prediction.class === 'person' && prediction.score > 0.4) {
            const [x, y, width, height] = prediction.bbox;

            ctx.strokeStyle = '#00ffcc';
            ctx.lineWidth = 4;
            ctx.shadowColor = '#00ffcc';
            ctx.shadowBlur = 10;
            ctx.strokeRect(x, y, width, height);

            ctx.fillStyle = '#00ffcc';
            ctx.shadowBlur = 0;
            const text = `HUMAN (${Math.round(prediction.score * 100)}%)`;
            ctx.font = '16px sans-serif';
            const textWidth = ctx.measureText(text).width;
            ctx.fillRect(x, y > 25 ? y - 25 : y, textWidth + 10, 22);

            ctx.fillStyle = '#000000';
            ctx.fillText(text, x + 5, y > 25 ? y - 8 : y + 16);
          }
        });
      }

      requestAnimationFrame(detectFrame);
    }

    // 4. Recording Functions
    function toggleRecording() {
      if (!isRecording) startRecording();
      else stopRecording();
    }

    function startRecording() {
      recordedChunks = [];
      const canvasStream = canvas.captureStream(30);
      
      let options = {};
      if (MediaRecorder.isTypeSupported('video/webm;codecs=vp9')) options = { mimeType: 'video/webm;codecs=vp9' };
      else if (MediaRecorder.isTypeSupported('video/webm')) options = { mimeType: 'video/webm' };
      else if (MediaRecorder.isTypeSupported('video/mp4')) options = { mimeType: 'video/mp4' };

      mediaRecorder = new MediaRecorder(canvasStream, options);

      mediaRecorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        const mimeType = mediaRecorder.mimeType || 'video/webm';
        const blob = new Blob(recordedChunks, { type: mimeType });
        const videoURL = URL.createObjectURL(blob);
        
        recordedVideo.src = videoURL;
        downloadBtn.href = videoURL;
        const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
        downloadBtn.download = `human-tracking-${Date.now()}.${ext}`;
        playbackModal.style.display = 'flex';
      };

      mediaRecorder.start();
      isRecording = true;
      recordBtn.innerText = '⏹ Stop Recording';
      recordBtn.classList.add('recording');
    }

    function stopRecording() {
      if (mediaRecorder && isRecording) {
        mediaRecorder.stop();
        isRecording = false;
        recordBtn.innerText = '🔴 Record';
        recordBtn.classList.remove('recording');
      }
    }

    closeModalBtn.addEventListener('click', () => {
      playbackModal.style.display = 'none';
      recordedVideo.pause();
    });

    recordBtn.addEventListener('click', toggleRecording);

    // 5. App Initialization
    async function init() {
      try {
        await setupCamera();
        video.play();
        detectFrame();

        statusText.innerText = 'Loading AI Model...';
        model = await cocoSsd.load();
        
        statusText.innerText = 'Tracking Active';
        statusText.style.borderColor = '#00ffcc';
        recordBtn.disabled = false;

      } catch (err) {
        statusText.innerText = 'Initialization failed.';
        console.error(err);
      }
    }

    init();
  </script>
</body>
</html>
