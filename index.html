<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- PWA Meta Tags -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#121212" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="https://upload.wikimedia.org/wikipedia/commons/thumb/d/d0/Radar_icon.svg/192px-Radar_icon.svg.png" />
  
  <title>Human Tracker Pro</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #121212; color: #ffffff;
      font-family: sans-serif; overflow: hidden;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; height: 100vh;
      /* Prevent pull-to-refresh on mobile */
      overscroll-behavior-y: contain; 
    }
    
    #controls {
      position: absolute; top: 15px; z-index: 10;
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center;
      width: 100%; padding: 0 10px;
    }
    
    .btn {
      background: #ff3366; color: white; border: none;
      padding: 8px 14px; border-radius: 20px; font-size: 13px;
      font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 4px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.5);
    }
    .btn-secondary { background: #3399ff; }
    .btn-dark { background: #333333; }
    .btn-gyro { background: #9933ff; }
    .btn:disabled { background: #555555; cursor: not-allowed; color: #999; }
    .btn.recording { background: #ff0000; animation: pulse 1.5s infinite; }
    .btn.torch-on { background: #ffcc00; color: #000; }
    .btn.gyro-on { background: #00ffcc; color: #000; }
    
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

    .container {
      position: relative; width: 100vw; height: 100vh;
      display: flex; justify-content: center; align-items: center;
    }
    video#webcam { display: none; }
    canvas#output { width: 100%; height: 100%; object-fit: cover; }

    #radarCanvas {
      position: absolute; bottom: 20px; left: 20px;
      width: 140px; height: 140px; border-radius: 50%;
      border: 3px solid #ff3366; z-index: 15;
      box-shadow: 0 4px 10px rgba(0,0,0,0.8);
      background: rgba(0, 20, 0, 0.7);
    }

    #minimap {
      position: absolute; bottom: 20px; right: 20px;
      width: 140px; height: 140px; border-radius: 15px;
      border: 3px solid #00ffcc; z-index: 15;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5); background: #222;
    }

    #playbackModal {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.9); z-index: 20; flex-direction: column;
      align-items: center; justify-content: center; gap: 15px; padding: 20px;
    }
    #recordedVideo { max-width: 90%; max-height: 70vh; border-radius: 10px; border: 2px solid #00ffcc; }
    .modal-actions { display: flex; gap: 15px; }
    .modal-btn { background: #00ffcc; color: #000; text-decoration: none; padding: 8px 16px; border-radius: 20px; font-weight:bold; cursor: pointer; border:none;}
    .btn-close { background: #444; color: #fff; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

  <div id="controls">
    <button id="switchLensBtn" class="btn btn-secondary">🔄 Switch</button>
    <button id="sensorBtn" class="btn btn-gyro">🧭 Sensors</button>
    <button id="torchBtn" class="btn btn-dark" disabled>🔦 N/A</button>
    <button id="recordBtn" class="btn" disabled>🔴 Record</button>
  </div>

  <div class="container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="output"></canvas>
  </div>
  
  <canvas id="radarCanvas" width="200" height="200"></canvas>
  <div id="minimap"></div>

  <div id="playbackModal">
    <h2>Playback Recording</h2>
    <video id="recordedVideo" controls></video>
    <div class="modal-actions">
      <a id="downloadBtn" class="modal-btn" download="human-tracking.webm">Download Video</a>
      <button id="closeModalBtn" class="modal-btn btn-close">Close</button>
    </div>
  </div>

  <script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('output');
    const ctx = canvas.getContext('2d');
    const radar = document.getElementById('radarCanvas');
    const radarCtx = radar.getContext('2d');
    const torchBtn = document.getElementById('torchBtn');
    const recordBtn = document.getElementById('recordBtn');
    const sensorBtn = document.getElementById('sensorBtn');
    
    let model;
    let videoTrack;
    let videoDevices = [];
    let currentDeviceIndex = 0;
    let isTorchOn = false;
    let isSwitchingCamera = false;
    let wakeLock = null;

    let mediaRecorder;
    let recordedChunks = [];
    let isRecording = false;

    let sensorsEnabled = false;
    let deviceAlpha = 0; 
    let deviceBeta = 0;  
    let deviceGamma = 0; 

    // PWA Service Worker Registration
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('Service Worker Registered'))
          .catch(err => console.error('Service Worker Error', err));
      });
    }

    sensorBtn.addEventListener('click', async () => {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const permission = await DeviceOrientationEvent.requestPermission();
          if (permission === 'granted') enableSensors();
          else alert("Permission denied to access device sensors.");
        } catch (err) { console.error("Sensor permission error:", err); }
      } else {
        enableSensors();
      }
    });

    function enableSensors() {
      window.addEventListener('deviceorientation', (event) => {
        deviceAlpha = event.webkitCompassHeading || event.alpha || 0;
        deviceBeta = event.beta || 0;
        deviceGamma = event.gamma || 0;
      });
      sensorsEnabled = true;
      sensorBtn.innerText = '🧭 Sensors: ON';
      sensorBtn.classList.add('gyro-on');
    }

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
      } catch (err) { console.warn(err); }
    }
    document.addEventListener('visibilitychange', async () => {
      if (wakeLock !== null && document.visibilityState === 'visible') await requestWakeLock();
    });

    async function getCameras() {
      try {
        const tempStream = await navigator.mediaDevices.getUserMedia({ video: true });
        const devices = await navigator.mediaDevices.enumerateDevices();
        videoDevices = devices.filter(d => d.kind === 'videoinput');
        tempStream.getTracks().forEach(track => track.stop());

        const backCameraIndex = videoDevices.findIndex(d => 
          d.label.toLowerCase().includes('back') || d.label.toLowerCase().includes('environment')
        );
        if (backCameraIndex !== -1) currentDeviceIndex = backCameraIndex;
      } catch (e) { console.error(e); }
    }

    async function startStream(deviceIndex) {
      isSwitchingCamera = true;
      isTorchOn = false;
      torchBtn.innerText = '🔦 Checking...';
      torchBtn.disabled = true;
      torchBtn.classList.remove('torch-on');

      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      try {
        let constraints = { video: { facingMode: 'environment' } };
        if (videoDevices.length > 0 && videoDevices[deviceIndex]?.deviceId) {
          constraints = { video: { deviceId: { exact: videoDevices[deviceIndex].deviceId } } };
        }

        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
        videoTrack = stream.getVideoTracks()[0];
        
        await new Promise((resolve) => {
          video.onloadedmetadata = () => { video.play().then(resolve).catch(resolve); };
        });

        setTimeout(() => {
          try {
            const caps = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
            if (caps.torch) {
              torchBtn.innerText = '🔦 Torch: OFF';
              torchBtn.disabled = false;
            } else {
              torchBtn.innerText = '🔦 Torch: N/A';
            }
          } catch(err) { torchBtn.innerText = '🔦 Torch: N/A'; }
        }, 500);
      } catch (e) { console.error(e); } finally { isSwitchingCamera = false; }
    }

    document.getElementById('switchLensBtn').addEventListener('click', async () => {
      if (videoDevices.length === 0 || isSwitchingCamera) return;
      currentDeviceIndex = (currentDeviceIndex + 1) % videoDevices.length;
      await startStream(currentDeviceIndex);
    });

    torchBtn.addEventListener('click', async () => {
      if (!videoTrack || isSwitchingCamera) return;
      try {
        isTorchOn = !isTorchOn;
        await videoTrack.applyConstraints({ advanced: [{ torch: isTorchOn }] });
        if (isTorchOn) {
          torchBtn.innerText = '🔦 Torch: ON';
          torchBtn.classList.add('torch-on');
        } else {
          torchBtn.innerText = '🔦 Torch: OFF';
          torchBtn.classList.remove('torch-on');
        }
      } catch (err) { console.error(err); }
    });

    let sweepAngle = 0;
    const MAX_RADAR_DISTANCE_METERS = 10; 
    const HUMAN_HEIGHT_METERS = 1.7; 

    function drawRadar(predictions) {
      const w = radar.width;
      const h = radar.height;
      const cx = w / 2;
      const cy = h / 2;
      
      radarCtx.clearRect(0, 0, w, h);
      
      radarCtx.strokeStyle = 'rgba(0, 255, 204, 0.3)';
      radarCtx.lineWidth = 1;
      for (let i = 1; i <= 3; i++) {
        radarCtx.beginPath();
        radarCtx.arc(cx, cy, (w/2) * (i/3), 0, Math.PI * 2);
        radarCtx.stroke();
      }

      if (sensorsEnabled) {
        const northAngle = (270 - deviceAlpha) * (Math.PI / 180); 
        const nX = cx + Math.cos(northAngle) * (cx - 15);
        const nY = cy + Math.sin(northAngle) * (cy - 15);
        
        radarCtx.fillStyle = '#9933ff';
        radarCtx.font = 'bold 14px sans-serif';
        radarCtx.textAlign = 'center';
        radarCtx.textBaseline = 'middle';
        radarCtx.fillText('N', nX, nY);
      }
      
      radarCtx.beginPath();
      radarCtx.moveTo(cx, 0); radarCtx.lineTo(cx, h);
      radarCtx.moveTo(0, cy); radarCtx.lineTo(w, cy);
      radarCtx.strokeStyle = 'rgba(0, 255, 204, 0.3)';
      radarCtx.stroke();

      sweepAngle = (sweepAngle + 0.05) % (Math.PI * 2);
      radarCtx.beginPath();
      radarCtx.moveTo(cx, cy);
      radarCtx.lineTo(cx + Math.cos(sweepAngle) * cx, cy + Math.sin(sweepAngle) * cy);
      radarCtx.strokeStyle = 'rgba(0, 255, 204, 0.8)';
      radarCtx.lineWidth = 2;
      radarCtx.stroke();

      predictions.forEach(p => {
        if (p.class === 'person' && p.score > 0.4) {
          const [boxX, boxY, boxWidth, boxHeight] = p.bbox;
          const focalLength = canvas.height * 0.8; 
          let distance = (HUMAN_HEIGHT_METERS * focalLength) / boxHeight;
          if (distance > MAX_RADAR_DISTANCE_METERS) distance = MAX_RADAR_DISTANCE_METERS;

          const offsetX = (boxX + boxWidth / 2) - (canvas.width / 2);
          const angle = Math.atan2(offsetX, focalLength) - (Math.PI / 2); 

          const pixelsPerMeter = (h / 2) / MAX_RADAR_DISTANCE_METERS;
          const plotX = cx + (Math.cos(angle) * (distance * pixelsPerMeter));
          const plotY = cy + (Math.sin(angle) * (distance * pixelsPerMeter));

          radarCtx.beginPath();
          radarCtx.arc(plotX, plotY, 6, 0, Math.PI * 2);
          radarCtx.fillStyle = '#ff3366'; 
          radarCtx.fill();
          radarCtx.shadowColor = '#ff3366';
          radarCtx.shadowBlur = 10;
          
          radarCtx.fillStyle = '#ffffff';
          radarCtx.font = '10px sans-serif';
          radarCtx.textAlign = 'left';
          radarCtx.shadowBlur = 0;
          radarCtx.fillText(`${distance.toFixed(1)}m`, plotX + 8, plotY + 4);
        }
      });
    }

    function drawTacticalHUD() {
      if (!sensorsEnabled) return;
      
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;

      ctx.save();
      ctx.fillStyle = '#00ffcc';
      ctx.font = '16px monospace';
      ctx.shadowColor = '#000';
      ctx.shadowBlur = 4;
      
      ctx.fillText(`HDG: ${Math.round(deviceAlpha).toString().padStart(3, '0')}°`, 20, 80);
      ctx.fillText(`PIT: ${Math.round(deviceBeta)}°`, 20, 105);
      ctx.fillText(`ROL: ${Math.round(deviceGamma)}°`, 20, 130);

      const pitchOffset = (deviceBeta / 90) * (canvas.height / 2);
      let rollOffset = (deviceGamma / 90) * (canvas.width / 2);
      
      const crossX = Math.max(50, Math.min(canvas.width - 50, cx + rollOffset));
      const crossY = Math.max(50, Math.min(canvas.height - 50, cy + pitchOffset));

      ctx.strokeStyle = 'rgba(153, 51, 255, 0.8)'; 
      ctx.lineWidth = 2;
      
      ctx.beginPath();
      ctx.moveTo(crossX - 30, crossY); ctx.lineTo(crossX - 10, crossY);
      ctx.moveTo(crossX + 10, crossY); ctx.lineTo(crossX + 30, crossY);
      ctx.moveTo(crossX, crossY - 30); ctx.lineTo(crossX, crossY - 10);
      ctx.moveTo(crossX, crossY + 10); ctx.lineTo(crossX, crossY + 30);
      ctx.stroke();

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
      ctx.beginPath();
      ctx.arc(cx, cy, 5, 0, Math.PI*2);
      ctx.stroke();

      ctx.restore();
    }

    async function detectFrame() {
      if (!isSwitchingCamera && video.readyState === 4 && video.videoWidth > 0 && video.videoHeight > 0) {
        if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
        }

        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        drawTacticalHUD();

        if (model) {
          try {
            const predictions = await model.detect(video);
            drawRadar(predictions);

            predictions.forEach(prediction => {
              if (prediction.class === 'person' && prediction.score > 0.4) {
                const [x, y, width, height] = prediction.bbox;

                ctx.strokeStyle = '#00ffcc';
                ctx.lineWidth = 4;
                ctx.shadowColor = '#00ffcc';
                ctx.shadowBlur = 10;
                ctx.strokeRect(x, y, width, height);

                ctx.fillStyle = '#00ffcc';
                ctx.shadowBlur = 0;
                const text = `HUMAN (${Math.round(prediction.score * 100)}%)`;
                ctx.font = '16px sans-serif';
                ctx.fillRect(x, y > 25 ? y - 25 : y, ctx.measureText(text).width + 10, 22);

                ctx.fillStyle = '#000000';
                ctx.fillText(text, x + 5, y > 25 ? y - 8 : y + 16);
              }
            });
          } catch(err) {}
        }
      }
      requestAnimationFrame(detectFrame);
    }

    function initGPS() {
      if (!("geolocation" in navigator)) return;
      let map, pathLine, init = false;
      
      navigator.geolocation.watchPosition((pos) => {
        const lat = pos.coords.latitude, lng = pos.coords.longitude;
        if (!init) {
          map = L.map('minimap', { zoomControl: false, attributionControl: false }).setView([lat, lng], 17);
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
          pathLine = L.polyline([[lat, lng]], {color: '#ff3366', weight: 4}).addTo(map);
          L.circleMarker([lat, lng], {color: '#00ffcc', radius: 6}).addTo(map);
          init = true;
        } else {
          pathLine.addLatLng([lat, lng]);
          map.panTo([lat, lng]);
        }
      }, null, { enableHighAccuracy: true });
    }

    recordBtn.addEventListener('click', () => {
      if (!isRecording) {
        recordedChunks = [];
        const canvasStream = canvas.captureStream(30);
        let options = MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? { mimeType: 'video/webm;codecs=vp9' } : { mimeType: 'video/webm' };
        mediaRecorder = new MediaRecorder(canvasStream, options);
        
        mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
        mediaRecorder.onstop = () => {
          const videoURL = URL.createObjectURL(new Blob(recordedChunks, { type: 'video/webm' }));
          document.getElementById('recordedVideo').src = videoURL;
          document.getElementById('downloadBtn').href = videoURL;
          document.getElementById('playbackModal').style.display = 'flex';
        };

        mediaRecorder.start();
        isRecording = true;
        recordBtn.innerText = '⏹ Stop Rec';
        recordBtn.classList.add('recording');
      } else {
        mediaRecorder.stop();
        isRecording = false;
        recordBtn.innerText = '🔴 Record';
        recordBtn.classList.remove('recording');
      }
    });

    document.getElementById('closeModalBtn').addEventListener('click', () => {
      document.getElementById('playbackModal').style.display = 'none';
      document.getElementById('recordedVideo').pause();
    });

    async function init() {
      try {
        await requestWakeLock();
        initGPS();
        await getCameras();
        if (videoDevices.length > 0) await startStream(currentDeviceIndex);
        
        detectFrame();
        model = await cocoSsd.load();
        recordBtn.disabled = false;
      } catch (err) { console.error('Init Failed', err); }
    }

    init();
  </script>
</body>
</html>
