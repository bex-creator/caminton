<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Human Tracker Pro</title>
  
  <!-- Leaflet CSS for the GPS Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #121212; color: #ffffff;
      font-family: sans-serif; overflow: hidden;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; height: 100vh;
    }
    
    #controls {
      position: absolute; top: 15px; z-index: 10;
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center;
      width: 100%; padding: 0 10px;
    }
    .badge {
      background: rgba(0, 0, 0, 0.7); padding: 8px 12px;
      border-radius: 20px; font-size: 13px; border: 1px solid #333;
    }
    .btn {
      background: #ff3366; color: white; border: none;
      padding: 8px 14px; border-radius: 20px; font-size: 13px;
      font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 4px;
    }
    .btn-secondary { background: #3399ff; }
    .btn:disabled { background: #555555; cursor: not-allowed; }
    .btn.recording { background: #ff0000; animation: pulse 1.5s infinite; }
    
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

    .container {
      position: relative; width: 100vw; height: 100vh;
      display: flex; justify-content: center; align-items: center;
    }
    video#webcam { display: none; }
    canvas#output { width: 100%; height: 100%; object-fit: cover; }

    /* Local Camera Radar */
    #radarCanvas {
      position: absolute; bottom: 20px; left: 20px;
      width: 140px; height: 140px; border-radius: 50%;
      border: 3px solid #ff3366; z-index: 15;
      box-shadow: 0 4px 10px rgba(0,0,0,0.8);
      background: rgba(0, 20, 0, 0.7);
    }

    /* GPS Minimap */
    #minimap {
      position: absolute; bottom: 20px; right: 20px;
      width: 140px; height: 140px; border-radius: 15px;
      border: 3px solid #00ffcc; z-index: 15;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5); background: #222;
    }

    /* Playback Modal */
    #playbackModal {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.9); z-index: 20; flex-direction: column;
      align-items: center; justify-content: center; gap: 15px; padding: 20px;
    }
    #recordedVideo { max-width: 90%; max-height: 70vh; border-radius: 10px; border: 2px solid #00ffcc; }
    .modal-actions { display: flex; gap: 15px; }
    .modal-btn { background: #00ffcc; color: #000; text-decoration: none; padding: 8px 16px; border-radius: 20px; font-weight:bold; cursor: pointer; border:none;}
    .btn-close { background: #444; color: #fff; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

  <div id="controls">
    <button id="switchLensBtn" class="btn btn-secondary">🔄 Switch Lens</button>
    <div id="torchStatus" class="badge">🔦 Torch: OFF</div>
    <button id="recordBtn" class="btn" disabled>🔴 Record</button>
  </div>

  <div class="container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="output"></canvas>
  </div>
  
  <canvas id="radarCanvas" width="200" height="200"></canvas>
  <div id="minimap"></div>

  <div id="playbackModal">
    <h2>Playback Recording</h2>
    <video id="recordedVideo" controls></video>
    <div class="modal-actions">
      <a id="downloadBtn" class="modal-btn" download="human-tracking.webm">Download Video</a>
      <button id="closeModalBtn" class="modal-btn btn-close">Close</button>
    </div>
  </div>

  <script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('output');
    const ctx = canvas.getContext('2d');
    const radar = document.getElementById('radarCanvas');
    const radarCtx = radar.getContext('2d');
    const torchStatusText = document.getElementById('torchStatus');
    const recordBtn = document.getElementById('recordBtn');
    
    let model;
    let videoTrack;
    let videoDevices = [];
    let currentDeviceIndex = 0;
    let isTorchOn = false;
    let lastBrightnessCheck = 0;

    let mediaRecorder;
    let recordedChunks = [];
    let isRecording = false;

    // ==========================================
    // 1. CAMERA FIX & SWITCHING
    // ==========================================
    async function getCameras() {
      // Open temporary stream to unlock device labels
      const tempStream = await navigator.mediaDevices.getUserMedia({ video: true });
      const devices = await navigator.mediaDevices.enumerateDevices();
      videoDevices = devices.filter(d => d.kind === 'videoinput');
      
      // FIX: Explicitly stop the temporary stream so the hardware is freed up!
      tempStream.getTracks().forEach(track => track.stop());

      // Default to back camera
      const backCameraIndex = videoDevices.findIndex(d => d.label.toLowerCase().includes('back') || d.label.toLowerCase().includes('environment'));
      if (backCameraIndex !== -1) currentDeviceIndex = backCameraIndex;
    }

    async function startStream(deviceIndex) {
      if (video.srcObject) {
        video.srcObject.getTracks().forEach(t => t.stop());
      }
      
      try {
        let constraints = { video: { facingMode: 'environment' } }; // Safe fallback
        if (videoDevices.length > 0 && videoDevices[deviceIndex].deviceId) {
          constraints = { video: { deviceId: { exact: videoDevices[deviceIndex].deviceId }, width: { ideal: 1280 } } };
        }

        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
        videoTrack = stream.getVideoTracks()[0];
        
        // Torch capability check
        setTimeout(() => {
          const caps = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
          if (caps.torch) {
            torchStatusText.innerText = '🔦 Torch: READY';
            torchStatusText.style.borderColor = '#00ffcc';
          } else {
            torchStatusText.innerText = '🔦 Torch: No Hardware';
            torchStatusText.style.borderColor = '#333';
            isTorchOn = false;
          }
        }, 500);

        return new Promise(resolve => {
          video.onloadedmetadata = () => { video.play(); resolve(); };
        });
      } catch (e) {
        console.error("Camera stream error: ", e);
        torchStatusText.innerText = "Camera Blocked";
      }
    }

    document.getElementById('switchLensBtn').addEventListener('click', async () => {
      if (videoDevices.length === 0) return;
      currentDeviceIndex = (currentDeviceIndex + 1) % videoDevices.length;
      await startStream(currentDeviceIndex);
    });

    // ==========================================
    // 2. AUTO TORCH LOGIC
    // ==========================================
    async function handleAutoTorch() {
      const now = Date.now();
      if (now - lastBrightnessCheck < 500) return;
      lastBrightnessCheck = now;

      if (!videoTrack) return;
      const capabilities = videoTrack.getCapabilities && videoTrack.getCapabilities();
      if (!capabilities || !capabilities.torch) return;

      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
      let totalLuminance = 0, samples = 0;
      
      for (let i = 0; i < imageData.length; i += 400) {
        totalLuminance += (0.299 * imageData[i] + 0.587 * imageData[i+1] + 0.114 * imageData[i+2]);
        samples++;
      }
      const avgBrightness = totalLuminance / samples;
      
      try {
        if (avgBrightness < 40 && !isTorchOn) {
          await videoTrack.applyConstraints({ advanced: [{ torch: true }] });
          isTorchOn = true;
          torchStatusText.innerText = '🔦 Auto-Torch: ON';
          torchStatusText.style.borderColor = '#ffcc00';
        } else if (avgBrightness > 80 && isTorchOn) {
          await videoTrack.applyConstraints({ advanced: [{ torch: false }] });
          isTorchOn = false;
          torchStatusText.innerText = '🔦 Auto-Torch: OFF';
          torchStatusText.style.borderColor = '#333';
        }
      } catch (err) { console.error('Flashlight err', err); }
    }

    // ==========================================
    // 3. RADAR MAPPING
    // ==========================================
    let sweepAngle = 0;
    const MAX_RADAR_DISTANCE_METERS = 10; 
    const HUMAN_HEIGHT_METERS = 1.7; 

    function drawRadar(predictions) {
      const w = radar.width;
      const h = radar.height;
      
      radarCtx.clearRect(0, 0, w, h);
      
      // Grid Rings
      radarCtx.strokeStyle = 'rgba(0, 255, 204, 0.3)';
      radarCtx.lineWidth = 1;
      for (let i = 1; i <= 3; i++) {
        radarCtx.beginPath();
        radarCtx.arc(w/2, h/2, (w/2) * (i/3), 0, Math.PI * 2);
        radarCtx.stroke();
      }
      
      // Crosshairs & Sweep
      radarCtx.beginPath();
      radarCtx.moveTo(w/2, 0); radarCtx.lineTo(w/2, h);
      radarCtx.moveTo(0, h/2); radarCtx.lineTo(w, h/2);
      radarCtx.stroke();

      sweepAngle = (sweepAngle + 0.05) % (Math.PI * 2);
      radarCtx.beginPath();
      radarCtx.moveTo(w/2, h/2);
      radarCtx.lineTo(w/2 + Math.cos(sweepAngle) * w/2, h/2 + Math.sin(sweepAngle) * h/2);
      radarCtx.strokeStyle = 'rgba(0, 255, 204, 0.8)';
      radarCtx.lineWidth = 2;
      radarCtx.stroke();

      // Plot Humans
      predictions.forEach(p => {
        if (p.class === 'person' && p.score > 0.4) {
          const [boxX, boxY, boxWidth, boxHeight] = p.bbox;
          const focalLength = canvas.height * 0.8; 
          let distance = (HUMAN_HEIGHT_METERS * focalLength) / boxHeight;
          if (distance > MAX_RADAR_DISTANCE_METERS) distance = MAX_RADAR_DISTANCE_METERS;

          const offsetX = (boxX + boxWidth / 2) - (canvas.width / 2);
          const angle = Math.atan2(offsetX, focalLength);

          const pixelsPerMeter = (h / 2) / MAX_RADAR_DISTANCE_METERS;
          const plotX = (w / 2) + (Math.sin(angle) * (distance * pixelsPerMeter));
          const plotY = (h - 10) - (Math.cos(angle) * (distance * pixelsPerMeter));

          radarCtx.beginPath();
          radarCtx.arc(plotX, plotY, 6, 0, Math.PI * 2);
          radarCtx.fillStyle = '#ff3366'; 
          radarCtx.fill();
          radarCtx.shadowColor = '#ff3366';
          radarCtx.shadowBlur = 10;
          
          radarCtx.fillStyle = '#ffffff';
          radarCtx.font = '10px sans-serif';
          radarCtx.shadowBlur = 0;
          radarCtx.fillText(`${distance.toFixed(1)}m`, plotX + 8, plotY + 4);
        }
      });
    }

    // ==========================================
    // 4. MAIN DETECTION LOOP
    // ==========================================
    async function detectFrame() {
      if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
      }

      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      handleAutoTorch();

      if (model) {
        const predictions = await model.detect(video);
        drawRadar(predictions);

        predictions.forEach(prediction => {
          if (prediction.class === 'person' && prediction.score > 0.4) {
            const [x, y, width, height] = prediction.bbox;

            ctx.strokeStyle = '#00ffcc';
            ctx.lineWidth = 4;
            ctx.shadowColor = '#00ffcc';
            ctx.shadowBlur = 10;
            ctx.strokeRect(x, y, width, height);

            ctx.fillStyle = '#00ffcc';
            ctx.shadowBlur = 0;
            const text = `HUMAN (${Math.round(prediction.score * 100)}%)`;
            ctx.font = '16px sans-serif';
            ctx.fillRect(x, y > 25 ? y - 25 : y, ctx.measureText(text).width + 10, 22);

            ctx.fillStyle = '#000000';
            ctx.fillText(text, x + 5, y > 25 ? y - 8 : y + 16);
          }
        });
      }

      requestAnimationFrame(detectFrame);
    }

    // ==========================================
    // 5. GPS & RECORDING RESTORED
    // ==========================================
    function initGPS() {
      if (!("geolocation" in navigator)) return;
      let map, pathLine, init = false;
      
      navigator.geolocation.watchPosition((pos) => {
        const lat = pos.coords.latitude, lng = pos.coords.longitude;
        if (!init) {
          map = L.map('minimap', { zoomControl: false, attributionControl: false }).setView([lat, lng], 17);
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
          pathLine = L.polyline([[lat, lng]], {color: '#ff3366', weight: 4}).addTo(map);
          L.circleMarker([lat, lng], {color: '#00ffcc', radius: 6}).addTo(map);
          init = true;
        } else {
          pathLine.addLatLng([lat, lng]);
          map.panTo([lat, lng]);
        }
      }, null, { enableHighAccuracy: true });
    }

    recordBtn.addEventListener('click', () => {
      if (!isRecording) {
        recordedChunks = [];
        const canvasStream = canvas.captureStream(30);
        let options = MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? { mimeType: 'video/webm;codecs=vp9' } : { mimeType: 'video/webm' };
        mediaRecorder = new MediaRecorder(canvasStream, options);
        
        mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
        mediaRecorder.onstop = () => {
          const videoURL = URL.createObjectURL(new Blob(recordedChunks, { type: 'video/webm' }));
          document.getElementById('recordedVideo').src = videoURL;
          document.getElementById('downloadBtn').href = videoURL;
          document.getElementById('playbackModal').style.display = 'flex';
        };

        mediaRecorder.start();
        isRecording = true;
        recordBtn.innerText = '⏹ Stop Rec';
        recordBtn.classList.add('recording');
      } else {
        mediaRecorder.stop();
        isRecording = false;
        recordBtn.innerText = '🔴 Record';
        recordBtn.classList.remove('recording');
      }
    });

    document.getElementById('closeModalBtn').addEventListener('click', () => {
      document.getElementById('playbackModal').style.display = 'none';
      document.getElementById('recordedVideo').pause();
    });

    // ==========================================
    // 6. START APP
    // ==========================================
    async function init() {
      try {
        initGPS();
        await getCameras();
        if (videoDevices.length > 0) await startStream(currentDeviceIndex);
        
        detectFrame();
        torchStatusText.innerText = 'Loading AI...';
        model = await cocoSsd.load();
        
        if(isTorchOn === false && torchStatusText.innerText !== '🔦 Torch: No Hardware') {
          torchStatusText.innerText = 'System Active';
        }
        recordBtn.disabled = false;
      } catch (err) {
        torchStatusText.innerText = 'Init Failed';
        console.error(err);
      }
    }

    init();
  </script>
</body>
</html>
